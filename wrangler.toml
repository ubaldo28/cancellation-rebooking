name = "roundtheway"
main = "src/index.ts"
# Pinned on purpose. wrangler login stores ONE machine-wide credential and
# will happily deploy to whatever account the browser was last signed into.
# With this set, a command run under any other account fails instead.
# weroundtheway@gmail.com's Account.
account_id = "5e08c8ea00fcdc2aa700d10b43bb4d21"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The public address, declared here rather than clicked into the dashboard.
#
# custom_domain = true tells wrangler to create the domain attachment and the
# DNS record for it on deploy, and to keep them. roundtheway.app is registered
# on this same account, so the zone already exists and nothing else has to be
# set up by hand.
#
# THIS MUST MATCH APP_URL BELOW. APP_URL is what goes into sign-in links, the
# sitemap and every canonical tag, so a Worker not actually answering on that
# hostname would email people links to a domain that does not resolve.
routes = [
  { pattern = "roundtheway.app", custom_domain = true },
]

# The dashboard is served by this same Worker, on this same origin.
#
# It used to live on a separate pages.dev origin while the API sat on
# workers.dev. That makes the session cookie third-party, and Safari blocks
# those outright while Chrome is phasing them out — so the dashboard could
# never stay signed in. One origin removes the problem instead of working
# around it, and CORS stops mattering for the app's own requests.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request goes to the Worker first, including the ones the assets binding
# ends up answering.
#
# This used to be the list of paths the Worker owns, with everything else
# served straight from the bucket. That is cheaper, and it also meant the
# Worker never saw the request for / — so no response header it sets could
# reach the page anybody actually looks at. Headers that cover the API and miss
# the site are not security headers, and framing the SPA is the entire phishing
# attack, so the Worker now sees everything and hands the static paths back to
# env.ASSETS itself. WORKER_PATHS in src/index.ts carries the old list and is
# what still makes a mistyped /api/thing answer JSON rather than the React app.
#
# /auth/verify is deliberately not in that list: the magic link lands on the
# React app, which posts the token to /api/auth/verify. Treating it as the
# Worker's would 404 the one link people arrive on.
#
# The search-facing pages are server-rendered on purpose: a crawler must get
# the openings and the prices in the first response, not after running
# JavaScript. That is /, /near, /near/*, /los-angeles, /browse,
# /browse/:category, /cost, /cost/:trade, /s/:trade, /p/:slug, /sitemap.xml and
# /robots.txt. Each of those except the last two also has a matching React
# route in web/src/App.tsx, because React mounts over the rendered HTML rather
# than replacing it — delete one side and the page draws and then vanishes.
#
# `/` IS ON THAT LIST NOW AND WAS NOT. It matched nothing in WORKER_PATHS and
# had no route, so this binding answered the site's own front door with the
# bare shell: an empty #root, no canonical, no heading and no link, at the
# address every external link to this site points at.
run_worker_first = true
# /c/:token, /a, /a/:token, /join, /search, /signin, /auth/verify, the footer's
# information pages and /app/* have no Worker route and fall through to the
# SPA. Only /book/* is the Worker's among the pages a customer posts from,
# because posting the form has to write to the database before anything is
# rendered.
#
# That fall-through is no longer a bare hand-back. not_found_handling above
# returns index.html with a 200 for ANY path with no file behind it, which made
# every address the site does not have a soft 404 — and an unbounded supply of
# them, because <Route path="/:metro"> in App.tsx swallows any single segment.
# SPA_PATHS in src/index.ts is the list of routes the app really has; anything
# else gets the same document with a 404 on it. A React route added to App.tsx
# and not to that list is a real page answering 404.
#
# /sw.js, /manifest.webmanifest and /icon.svg are real files under web/public
# and are served by the assets binding. A service worker delivered as text/html
# fails silently and push never arrives, so check its content type after a
# deploy rather than assuming.

# Where a van's live position lives.
#
# One object per operator, holding the current fix in memory and overwriting
# it. A position ping is then a memory update, not a database write — which is
# the difference between roughly 150 million D1 writes a month at ten thousand
# vans and almost none. Storage is touched about once every five minutes purely
# so an evicted object does not make a van vanish mid-journey.
[[durable_objects.bindings]]
name = "VAN"
class_name = "VanTracker"

# SQLite-backed is the only kind the Workers Free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VanTracker"]

[[d1_databases]]
binding = "DB"
database_name = "roundtheway"
database_id = "39306513-a575-42ec-ab23-eaa40d3d91c0"

# PHOTOS -- every picture the product keeps: an operator's finished work on
# their public profile, and the before/during/after proof on a booking. A
# stranger deciding whether to let someone into their driveway looks at
# pictures, not at a price list.
#
# WORKERS KV, NOT R2. This was an [[r2_buckets]] block for the whole life of
# the codebase and it never once ran. Turning R2 on requires attaching a
# subscription to a card on file, this is run on a zero budget, so the block
# stayed commented out, env.PHOTOS was undefined in production, and every photo
# route answered 503 from the first deploy onwards. KV needs no card and no
# subscription. It is a worse fit for images and it is the store that actually
# exists, which beats the better one that does not.
#
# WHAT THE FREE KV ALLOWANCE IS, because the numbers are small and they are the
# whole reason for this choice:
#   - 1 GB of stored data for the WHOLE ACCOUNT. Not per month, not per
#     namespace -- a gigabyte, standing. When it is full it is full and the
#     next upload fails. The retention sweep is what keeps it usable.
#   - 25 MiB per value. The upload doors cap at 5 MB (profile) and 6 MiB
#     (job proof), so nothing is near it.
#   - 1,000 writes a day and 100,000 reads a day, account-wide.
# The reasoning about living inside those is at the top of src/lib/photostore.ts
# and is not repeated here.
#
# LIVE SINCE 13 SEPTEMBER 2026. It was commented out before this, and the
# reason was worth keeping in mind if it is ever switched off again: a binding
# whose namespace id does not exist fails the WHOLE deploy, which would take the
# site down over a feature nothing else depends on. The Worker still treats
# env.PHOTOS as optional -- with it unset the photo routes answer 503 or 404 and
# every other part of the site works normally -- so commenting these three lines
# out is a safe thing to do in an emergency, and losing the id is not a crisis.
#
# The namespace was created with:
#     npx wrangler kv namespace create PHOTOS
# which needs nothing enabled in the dashboard and asks for no card. That is the
# whole reason photos are on KV rather than on R2: R2's free tier is ten times
# the room and costs nothing to use, but switching it on means attaching a
# subscription to a card, and this project does not put a card behind anything.
# `npm run kv:create` is the same command through scripts/cf.sh, which refuses
# to run against the wrong Cloudflare account -- use it if this machine has more
# than one, which this one does.
#
# THE ID BELOW IS NOT A SECRET. A KV namespace id names a namespace inside an
# account; reaching it still needs that account's credentials. It is committed
# here for the same reason the D1 database id is: a deploy that depends on a
# value nobody can find is a deploy only one laptop can do.
#
# The binding name must stay exactly "PHOTOS" -- src/types.ts and every photo
# route in src/index.ts, src/lib/proof.ts and src/lib/retention.ts read it by
# that name.
#
# There is no separate preview namespace configured on purpose: `wrangler dev`
# simulates KV locally without one, and adding preview_id means a second
# namespace to keep in step for no benefit at this size.

[[kv_namespaces]]
binding = "PHOTOS"
id = "9ce979ce574741869d2e78fd49477aff"

[vars]
APP_URL = "https://roundtheway.app"
# Distance provider: "estimate" costs nothing and needs no key.
# Switch to "google" or "mapbox" only when accuracy justifies the bill.
DISTANCE_PROVIDER = "estimate"
# Geocoding always tries the local postal_codes table first (~100 countries,
# offline, free). This flag only controls the optional sharper lookups:
#   "auto" — also use postcodes.io for GB and US Census for US
#   "none" — table only, zero outbound geocoding calls
GEOCODE_PROVIDER = "auto"

# Exact origins allowed to call the API with a session cookie. No wildcards —
# credentials plus a wildcard would let any site drive an operator's account.
#
# PRODUCTION ORIGINS ONLY, AND http://localhost:5173 WAS ONE OF THEM. It is
# gone, and this is the note so it does not come back. The CORS layer echoes an
# allowed origin with access-control-allow-credentials: true, which is the
# browser being told "requests from that origin may carry this person's session
# cookie and may read the answer". A developer's machine is not a trusted
# origin: anything listening on that port while somebody browses — a stray
# project, a dependency's dev server, a page that asked the browser to open
# localhost — could read and write that person's live account, with their own
# cookie, and same-origin protections would not apply because we said this
# origin was fine. It is a production allowance that only ever existed for local
# convenience, and it reached every real customer and operator.
#
# WHERE IT GOES INSTEAD. The dev origin belongs to the dev machine, not to this
# file, which is deployed:
#   .dev.vars  — `wrangler dev` reads it and its values override [vars] here,
#                so one line does it:
#                  ALLOWED_ORIGINS="http://localhost:5173,https://roundtheway.app"
#                .dev.vars is in .gitignore, and it has to stay there: a dev
#                override committed back into the repository is this same hole
#                with an extra step.
#   or a flag  — `wrangler dev --var ALLOWED_ORIGINS:http://localhost:5173`,
#                which leaves nothing on disk at all.
# Either way it exists on the machine that needs it and nowhere the deploy can
# reach.
ALLOWED_ORIGINS = "https://roundtheway.app"

# WHO SENDS THE SITE'S EMAIL. "resend" | "postmark" | "none".
#
# This said "none" while the site was live, which meant nobody could sign in at
# all: /api/auth/request is the only door a business has, it sends a magic
# link, and with no provider it answered 503 to everybody. The endpoint
# refusing is correct -- it will not fall back to handing the link to the
# caller -- but "none" in production is not a safe default, it is a closed
# shop. Resend's free tier covers 3,000 emails a month and 100 a day, which is
# more than pre-launch needs and costs nothing.
#
# EMAIL_FROM is a var rather than a secret because it is in the header of every
# email that goes out. EMAIL_API_KEY is the secret. Sending stays refused until
# BOTH are set, so a key with no address is an honest 503 and not a 502 on the
# sign-in path -- see the note at the top of src/lib/email.ts.
#
# THE DOMAIN IN EMAIL_FROM MUST BE VERIFIED IN RESEND BEFORE THIS WORKS.
# Add roundtheway.app under Domains in the Resend dashboard and publish the DKIM
# and SPF records it gives you (the zone is on this same Cloudflare account).
# Until those records resolve, Resend answers 403 to EVERY send and sign-in is
# down for everyone -- it does not degrade, it stops. Verify the domain first,
# then deploy this.
EMAIL_PROVIDER = "resend"        # "resend" | "postmark" | "brevo" | "none"
EMAIL_FROM = "Round The Way <hello@roundtheway.app>"

# THE SECOND SENDER, and why there are two.
#
# Two kinds of email leave this site and they fail in opposite directions. A
# sign-in link is ONE message somebody is staring at a form waiting for. An
# opening alert is MANY messages nobody is waiting on, and one arriving a
# minute late is still a useful alert.
#
# On one provider they share a daily allowance, so the alerts -- the side that
# grows with how well the site is doing -- spend it, and the sign-ins are what
# start failing. That is exactly backwards: a missed alert is a missed opening,
# a missed sign-in is a business locked out of its own account, and it breaks
# on the busiest day rather than the quietest.
#
# So alerts get their own provider and their own allowance. Resend's free tier
# is 100 a day; Brevo's is 300. Brevo is deliberately NOT the sign-in sender:
# past its daily allowance it QUEUES a transactional message rather than
# refusing it, which is right for an alert and wrong for a link that expires in
# fifteen minutes.
#
# Leaving these unset is not a broken deployment, just a smaller one --
# everything falls back to EMAIL_PROVIDER above. Same for a half-finished one:
# BULK_EMAIL_PROVIDER named with no BULK_EMAIL_API_KEY yet sends alerts through
# Resend rather than stopping them. BULK_EMAIL_FROM is optional even once Brevo
# is live: unset means alerts send as EMAIL_FROM, which is right whenever both
# providers are verified for roundtheway.app.
#
# ROUNDTHEWAY.APP MUST BE VERIFIED IN BREVO TOO. Each provider needs its own
# DKIM records in the zone; they do not share one set. Until Brevo's resolve,
# every alert send is refused BY BREVO -- and a refusal is not a fallback, so
# alerts stop rather than quietly rerouting. Verify the domain first.
BULK_EMAIL_PROVIDER = "brevo"    # "resend" | "postmark" | "brevo" | "none"
# BULK_EMAIL_FROM = "Round The Way <hello@roundtheway.app>"

# "on" publishes a no-sign-in demo account at /demo, rebuilt on every visit.
DEMO_MODE = "on"

# WHO SENDS THE SITE'S TEXT MESSAGES. "telnyx" | "none".
#
# Named rather than inferred from whichever keys happen to be present. Absent
# is "none", and none means every account creation and every booking is
# REFUSED with 503 rather than quietly proceeding without the code — see the
# note at the top of src/lib/sms.ts.
#
# TELNYX_FROM is the number in E.164 (+18185550142). It is a var rather than a
# secret because a sending number is public the moment the first text arrives;
# TELNYX_API_KEY is the secret. Sending stays refused until BOTH are set, so a
# key with no number is an honest 503 and not a 502 on the sign-in path.
SMS_PROVIDER = "telnyx"
TELNYX_FROM = ""

[triggers]
crons = ["*/15 * * * *"]

# Secrets — set with: wrangler secret put <NAME>
#   SESSION_PEPPER      required, random 32+ bytes
#   EMAIL_API_KEY       The provider's API key. REQUIRED — EMAIL_PROVIDER is
#                       "resend" above, and until this is set every sign-in
#                       answers 503 because the magic link cannot be sent.
#                       From resend.com -> API Keys, with sending permission
#                       only; it starts "re_". A key alone is not enough: the
#                       domain in EMAIL_FROM has to be verified in Resend or
#                       every send 403s. Set it with
#                         wrangler secret put EMAIL_API_KEY
#                       Rotating it is a secret put and nothing else — no
#                       redeploy, and no existing session is affected.
#   BULK_EMAIL_API_KEY  The SECOND provider's key — the one that carries the
#                       opening alerts, so a busy afternoon cannot spend the
#                       allowance the sign-in links need. BULK_EMAIL_PROVIDER
#                       is "brevo" in [vars] above; Brevo's key starts
#                       "xkeysib-" and comes from SMTP & API -> API Keys.
#                         wrangler secret put BULK_EMAIL_API_KEY
#                       Until this is set the alerts fall back to Resend, which
#                       works and is simply the smaller version of the site.
#   AUTH_DEBUG_TOKEN    LOCAL DEV ONLY. Never set this on a production deploy.
#                       Even if set, the sign-in link is only echoed when
#                       APP_URL is localhost. *.workers.dev is a real public
#                       deployment and is deliberately NOT trusted here.
#   DISTANCE_API_KEY    only if DISTANCE_PROVIDER is google/mapbox
#   TELNYX_API_KEY      the site's own texts (sign-in codes). Required once
#                       SMS_PROVIDER = "telnyx"; TELNYX_FROM is a var above.
#   VAPID_PUBLIC_KEY    Web Push. Without all three, push is simply off: the
#   VAPID_PRIVATE_KEY   alerts UI hides itself and nothing throws.
#   VAPID_SUBJECT       mailto: or https: URL. Push services reject anything else.
#                       NEVER rotate these once browsers have subscribed —
#                       every subscription is bound to the public key and would
#                       go silently dead.
#   TURNSTILE_SECRET    Cloudflare Turnstile, in front of the four public forms
#                       a script can use to cost somebody money: placing an
#                       order, asking a working operator for a job now, opening
#                       a conversation, and creating a standing alert.
#
#                       NOT SET ANYWHERE YET, WHICH MEANS THE FORMS ARE NOT
#                       PROTECTED YET. While it is absent the check is skipped
#                       outright and those endpoints behave exactly as they did
#                       before it was added — deliberate, so this ships and
#                       runs locally without a key, but do not read the code
#                       existing as the protection being on. It comes on the
#                       day this is set, and not before.
#
#                       Its public half is a build-time variable for the front
#                       end, not a secret and not read here:
#                         VITE_TURNSTILE_SITE_KEY=... npm run build
#                       Both come from the same Turnstile widget in the
#                       dashboard, and setting one without the other is handled
#                       (see src/lib/turnstile.ts) but is not a state to sit in.
#
#   STRIPE_WEBHOOK_SECRET
#                       The signing secret (whsec_...) for the Stripe webhook
#                       endpoint at /webhooks/stripe.
#
#                       NOT SET ANYWHERE YET either, but the consequence is the
#                       OPPOSITE of Turnstile's and the difference is
#                       deliberate. Turnstile absent means the check steps
#                       aside and the forms are as open as they were before it
#                       existed. This absent means the endpoint answers 503 and
#                       processes nothing at all: it will one day mark jobs
#                       paid and reverse fees, and there is no version of that
#                       worth running unauthenticated "for now". A missing
#                       secret here fails closed, on purpose.
#                       See src/lib/payments.ts.
#
#   ADMIN_EMAILS        Comma-separated operator emails allowed to work the
#                       moderation queue at /api/admin/*. A secret rather than
#                       a [vars] entry because it is the entire access-control
#                       list for reading other people's disputes and
#                       suspending businesses, and [vars] is committed to this
#                       file. Unset means nobody, which is the right default.
#                       Every use of those routes is recorded in admin_actions
#                       — see src/lib/audit.ts.
#
# NOTHING SENSITIVE BELONGS IN [vars] ABOVE. Everything in that block is
# committed to this repository and is readable in the Cloudflare dashboard by
# anybody with access to the account. The values there are deliberately all
# switches and public URLs: which distance provider to use, which origins may
# send a cookie, whether the demo is on. If a value would matter in a leaked
# copy of this file, it is a secret and goes through `wrangler secret put`.

# ---------------------------------------------------------------------------
# LOGS. Off by default, and off is how this deployment ran its first live day.
#
# Without this block Cloudflare keeps nothing: no record of a request, no
# console line, no stack trace. The dashboard says "Workers Observability is
# Disabled" and shows an empty chart, which reads like "nothing has gone wrong"
# and actually means "nothing is being written down".
#
# That is survivable on a hobby project and it is not survivable here, because
# of what runs on a schedule. Every fifteen minutes the cron above settles
# money: reconcileUnpaidOrders catches a payment whose webhook never arrived,
# and settleDueWork transfers a finished job's share to the business. Both are
# invisible to every screen in the product. If either starts throwing, nothing
# anywhere says so — the first person to notice is a business asking where
# their money is, days later, and by then there is no log to read about what
# happened on the day it broke.
#
# The Stripe webhook is the same shape: it answers 200 to Stripe whatever it
# decides internally, deliberately, because returning an error makes Stripe
# retry for days over an event nothing reads. That is the right behaviour and
# it means the only trace of a rejected signature or an event that could not
# be applied is a console line, which until now went nowhere.
#
# head_sampling_rate = 1 keeps everything. It is set explicitly rather than
# left to the default so that the day somebody turns it down to save quota,
# they do it on purpose. The account is on the free plan — 200,000 events a
# day, sampled rather than billed past that — so this costs nothing at this
# size, and what it buys is being able to answer "what happened" at all.
#
# lib/redact.ts and the logging rules around it are what make this safe to
# switch on: no name, address, email, phone, token or payload is ever printed.
# console.log('stripe webhook', event.type) is the shape — the type, never the
# body. If that ever stops being true, this block is the reason it matters.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
