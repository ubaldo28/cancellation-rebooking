<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Round The Way">
  <!--
    RTW IN OLD ENGLISH, cut to outlines from Pirata One.

    A favicon cannot load a webfont — SVG icons do not, in any browser that
    matters — so setting this as text would render in whatever the OS felt like
    and be a different logo on every device. These are the real outlines of the
    real face, converted once, so it is the same mark everywhere and costs no
    request.

    TRACKED OUT WELL PAST THE FONT'S OWN SPACING. Blackletter is drawn to be set
    tight in a line of text, where the eye reads the rhythm rather than each
    letter. Three of them alone at icon size, on the face's own advances, close
    into one shape that reads as nothing at all — so the letters are pushed
    apart until each is its own.

    Scaled to the letters' actual inked bounds rather than to the font's line
    box, so it is optically centred rather than centred around whitespace the
    glyphs never use.
  -->
  <rect width="512" height="512" rx="112" fill="#0A0E13"/>
  <g fill="#4CB3F0" transform="translate(80.35 345.23) scale(0.23452 -0.23452)">
    <path transform="translate(0.00 0)" d="M209 672Q191 672 170 657V332Q196 332 228.0 348.5Q260 365 260 383V598Q260 672 209 672ZM50 102V620Q50 681 9 689V711L110 768Q130 760 150.0 739.0Q170 718 170 701Q280 768 296.0 768.0Q312 768 346.5 727.0Q381 686 381 653V372Q381 364 272 321Q318 166 380 112Q408 89 437 89V59Q344 0 319 0Q286 0 235.5 124.0Q185 248 181 288L170 285V154Q170 117 178.0 101.0Q186 85 211 85V54L6 -32L-10 0Q12 0 32 26Q50 51 50 102Z"/>
