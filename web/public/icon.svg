    <path transform="translate(917.00 0)" d="M260 623Q260 678 211 688V710Q319 770 320 770Q329 770 352.0 750.5Q375 731 380 709Q382 711 441.0 740.5Q500 770 501 770Q521 770 545 746Q591 700 591 623V93Q591 84 484.0 42.0Q377 0 351 0Q304 0 273 62Q163 0 134.0 0.0Q105 0 77.5 42.5Q50 85 50 121V623Q50 678 1 688V710L110 771Q132 762 151.0 741.5Q170 721 170 704V195Q170 100 229 100Q244 100 260 106ZM470 107V587Q470 639 449.0 656.5Q428 674 381 675V185Q381 153 393.5 125.5Q406 98 428.0 98.0Q450 98 470 107Z"/>
