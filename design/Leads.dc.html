<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #1b6b4a; text-decoration: none; }
    a:hover { color: #145038; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf9; color: #1c1a17; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Open jobs</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #1b6b4a;">£1,055</div>
    </div>
    <div style="font-size: 13.5px; color: #6b6560; line-height: 1.45;">Quoted work nobody has booked yet. These are what fill a gap when nobody is due a repeat visit.</div>
  </div>

  <div style="flex-grow: 1; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

    <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="5">
      <div style="{{ j.cardStyle }}">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
            <span style="font-size: 15px; font-weight: 600; line-height: 1.3;">{{ j.title }}</span>
            <span style="font-size: 12.5px; color: #6b6560;">{{ j.client }}</span>
          </div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; white-space: nowrap;">{{ j.value }}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span style="{{ j.urgencyChip }}">{{ j.urgencyLabel }}</span>
          <span style="{{ j.partsChip }}">{{ j.partsLabel }}</span>
          <span style="font-size: 12px; color: #a49d96;">{{ j.age }}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="border-top: 1px solid #e5e0da; background: #ffffff; padding: 14px 20px 24px;">
    <button style="height: 50px; width: 100%; border: 1.5px solid #1c1a17; border-radius: 10px; background: #ffffff; color: #1c1a17; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Log a quote
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (tone) => {
      const map = {
        urgent:  'background: #fbf0e4; color: #a8571b;',
        normal:  'background: #f2efec; color: #6b6560;',
        ready:   'background: #eaf2ed; color: #1b6b4a;',
        blocked: 'background: #f5eeee; color: #96504a;',
      };
      return 'font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 20px; white-space: nowrap; ' + map[tone];
    };

    const rows = [
      { title: 'Replace kitchen mixer tap', client: 'Hannah Odell · Withington', value: '£180',
        urgencyLabel: 'Urgent', urgencyTone: 'urgent', partsLabel: 'Ready to go', partsTone: 'ready',
        age: 'quoted 9 days ago', blocked: false },
      { title: 'Boiler pump swap', client: 'Grace Whitworth · Sale', value: '£420',
        urgencyLabel: 'Urgent', urgencyTone: 'urgent', partsLabel: 'Waiting on parts', partsTone: 'blocked',
        age: 'quoted 4 days ago', blocked: true },
      { title: 'Radiator valves ×3', client: 'Bilal Hussain · Levenshulme', value: '£240',
        urgencyLabel: 'Soon', urgencyTone: 'normal', partsLabel: 'Ready to go', partsTone: 'ready',
        age: 'quoted 3 weeks ago', blocked: false },
      { title: 'Bathroom seal redo', client: 'Nadia Farouk · Fallowfield', value: '£120',
        urgencyLabel: 'Whenever', urgencyTone: 'normal', partsLabel: 'Ready to go', partsTone: 'ready',
        age: 'quoted 6 weeks ago', blocked: false },
      { title: 'Outside tap install', client: 'Callum Reece · Chorlton', value: '£95',
        urgencyLabel: 'Whenever', urgencyTone: 'normal', partsLabel: 'Ready to go', partsTone: 'ready',
        age: 'quoted 2 months ago', blocked: false },
    ];

    return {
      jobs: rows.map((r) => ({
        ...r,
        cardStyle:
          'background: #ffffff; border: 1px solid #e5e0da; border-radius: 11px; padding: 13px 14px; ' +
          'display: flex; flex-direction: column; gap: 10px; ' +
          (r.blocked ? 'opacity: 0.55;' : ''),
        urgencyChip: chip(r.urgencyTone),
        partsChip: chip(r.partsTone),
      })),
    };
  }
}
</script>
</body>
</html>
