<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #1b6b4a; text-decoration: none; }
    a:hover { color: #145038; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf9; color: #1c1a17; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Clients</div>
      <div style="font-size: 13px; color: #6b6560;">142</div>
    </div>

    <div style="display: flex; gap: 7px;">
      <span style="font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 20px; background: #1c1a17; color: #ffffff; min-height: 36px; display: flex; align-items: center;">Late 24</span>
      <span style="font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 20px; background: #ffffff; border: 1px solid #e5e0da; color: #6b6560; min-height: 36px; display: flex; align-items: center;">All</span>
      <span style="font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 20px; background: #ffffff; border: 1px solid #e5e0da; color: #6b6560; min-height: 36px; display: flex; align-items: center;">No consent 8</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

    <sc-for list="{{ clients }}" as="c" hint-placeholder-count="6">
      <div style="background: #ffffff; border: 1px solid #e5e0da; border-radius: 11px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; min-height: 68px;">
        <div style="{{ c.avatarStyle }}">{{ c.initials }}</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 15px; font-weight: 600;">{{ c.name }}</span>
          <span style="font-size: 12.5px; color: #6b6560;">{{ c.detail }}</span>
        </div>
        <span style="{{ c.pillStyle }}">{{ c.pill }}</span>
      </div>
    </sc-for>

    <!-- consent is the thing that gets an operator's number blocked, so it is not buried -->
    <div style="background: #ffffff; border: 1px solid #e5e0da; border-radius: 11px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; min-height: 68px; opacity: 0.6;">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #f2efec; color: #6b6560; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;">OP</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 15px; font-weight: 600;">Owen Pryce</span>
        <span style="font-size: 12.5px; color: #6b6560;">Interior only, no repeat set · last done 4 Jun</span>
      </div>
      <span style="font-size: 11.5px; font-weight: 500; padding: 4px 9px; border-radius: 20px; background: #f2efec; color: #6b6560; white-space: nowrap;">no consent</span>
    </div>
  </div>

  <div style="border-top: 1px solid #e5e0da; background: #ffffff; padding: 14px 20px 24px; display: flex; gap: 10px;">
    <button style="flex-grow: 1; height: 50px; border: 1.5px solid #1c1a17; border-radius: 10px; background: #ffffff; color: #1c1a17; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Import a list</button>
    <button style="width: 50px; height: 50px; border: 0; border-radius: 10px; background: #1b6b4a; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (tone) => {
      const map = {
        hot:  'background: #fbf0e4; color: #a8571b;',
        warm: 'background: #f5f0e8; color: #8a7a5d;',
        calm: 'background: #eaf2ed; color: #1b6b4a;',
      };
      return 'font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 20px; white-space: nowrap; ' + map[tone];
    };
    const avatar = (bg, fg) =>
      'width: 38px; height: 38px; border-radius: 50%; background: ' + bg + '; color: ' + fg + '; ' +
      'display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;';

    // Every row states the two facts the number rests on: when they were last
    // done, and how often that service repeats. "Late" is the difference.
    const rows = [
      { initials: 'MK', name: 'Marta Kowalczyk', detail: 'Full detail, every 4 wks · last done 6 Jul',  pill: '4 weeks late',  tone: 'hot'  },
      { initials: 'DH', name: 'Dean Halliwell',  detail: 'Full detail, every 4 wks · last done 14 Jul', pill: '3 weeks late',  tone: 'hot'  },
      { initials: 'AN', name: 'Aisha Nkemdirim', detail: 'Wash & wax, every 3 wks · last done 25 Jul',  pill: '2 weeks late',  tone: 'warm' },
      { initials: 'RC', name: 'Ryan Castledine', detail: 'Full detail, every 4 wks · last done 6 Aug',  pill: 'due today',     tone: 'calm' },
      { initials: 'JB', name: 'Joel Barnaby',    detail: 'Full detail, every 4 wks · last done 13 Aug', pill: 'due in 7 days', tone: 'calm' },
      { initials: 'SM', name: 'Sofia Marchetti', detail: 'Wash & wax · booked in today',                pill: 'booked',        tone: 'calm' },
    ];

    return {
      clients: rows.map((r) => ({
        ...r,
        pillStyle: pill(r.tone),
        avatarStyle: r.tone === 'hot'
          ? avatar('#fbf0e4', '#a8571b')
          : avatar('#f2efec', '#6b6560'),
      })),
    };
  }
}
</script>
</body>
</html>
